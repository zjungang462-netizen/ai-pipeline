name: Verified Package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Use runner temporary directory
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and independently unpacked package
        working-directory: agent-orchestrator
        run: python scripts/release.py --output '${{ runner.temp }}/verified-package'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-package-${{ github.sha }}
          path: ${{ runner.temp }}/verified-package/
          retention-days: 30
