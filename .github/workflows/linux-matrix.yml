name: Linux Offline Matrix
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-matrix.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'agent-orchestrator/orchestrator/**'
      - 'agent-orchestrator/tests/**'
      - 'agent-orchestrator/scripts/**'
      - 'agent-orchestrator/*.toml'

permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full offline acceptance
        working-directory: agent-orchestrator
        run: python scripts/verify_delivery.py --suite full --workers 8 --timing-baseline tests/fixtures/verification-module-timings.json --redact-logs --allow-linux-windows-skips --output "$RUNNER_TEMP/linux-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.python }}-${{ github.sha }}
          path: ${{ runner.temp }}/linux-evidence/
          overwrite: true
          retention-days: 14
