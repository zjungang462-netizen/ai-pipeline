# 可运行的受控双缺陷示例。运行会实际调用 API 并修改 examples/unattended_demo 下的两个源码文件。
# schema: root.task_workdir：任务工作目录，相对配置文件目录解析
task_workdir = "./examples/unattended_demo"
# schema: root.state_dir：状态目录，相对配置文件目录解析
state_dir = "./.unattended_state"
# schema: root.serial：当前只支持 true，阶段串行执行
serial = true
# schema: root.watch_root：有限监视域；相对配置目录解析；空或 off 关闭
watch_root = "off"

[run_budget]
# schema: run_budget.max_tokens：运行累计 token 上限；unlimited_tokens=true 时不设置
max_tokens = 12000
# schema: run_budget.max_duration_s：运行累计秒数上限；无人值守时必须为正数
max_duration_s = 180

[autonomy]
# schema: autonomy.enabled：显式开启无人值守
enabled = true
# schema: autonomy.auto_approve：预授权自动批准的阶段名列表
auto_approve = ["coding"]
# schema: autonomy.allowed_files：允许修改的相对文件路径白名单
allowed_files = ["name_ops.py", "count_ops.py"]
# schema: autonomy.baseline_paths：首次初始化加入基线的相对路径
baseline_paths = ["name_ops.py", "count_ops.py", "tests"]
# schema: autonomy.max_repair_rounds：整个反馈链的最大修复轮数
max_repair_rounds = 3
# schema: autonomy.max_stagnant_rounds：连续无进展的最大轮数
max_stagnant_rounds = 2
# schema: autonomy.repair_batch_size：单轮最多修改文件数
repair_batch_size = 1
# schema: autonomy.output_tokens：有限 token 模式的单次输出额度；unlimited_tokens 时不施加此本地限制
output_tokens = 1024
# schema: autonomy.context_chars：上下文字符数上限
context_chars = 8000

[autotune]
# schema: autotune.enabled：开启策略提案与选择
enabled = true
# schema: autotune.auto_apply：自动选择需同时启用 autonomy 和 autotune
auto_apply = true
# schema: autotune.min_runs：最少同配置终态记录数
min_runs = 5
# schema: autotune.max_batch_size：可自动选择的修复文件批量上限
max_batch_size = 2

[[stages]]
# schema: stages.name：唯一阶段名；字母数字、下划线、点或横线，禁止父目录段
name = "coding"
# schema: stages.kind：code/report/review/test；verify 是 test 的兼容别名
kind = "code"
# schema: stages.adapter：非 test 阶段必填，引用具名适配器
adapter = "api"
# schema: stages.prompt：非 test 阶段必填；提示词文件或内联文本
prompt = "prompts/unattended_coding.md"
# schema: stages.approval：成功产物是否等待人工审批
approval = true
# schema: stages.context_files：显式上下文相对文件路径列表
context_files = ["name_ops.py", "count_ops.py"]
# schema: stages.precheck_cmd：仅 code 可设，运行前真实检查命令 argv
precheck_cmd = ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
# schema: stages.timeout_s：单次执行超时，秒
timeout_s = 60
# schema: stages.max_attempts：本轮适配器调用尝试次数上限
max_attempts = 2

[[stages]]
# schema: stages.name：唯一阶段名；字母数字、下划线、点或横线，禁止父目录段
name = "testing"
# schema: stages.kind：code/report/review/test；verify 是 test 的兼容别名
kind = "test"
# schema: stages.test_cmd：test 必填的非空 argv 数组，其它类型禁止设置
test_cmd = ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
# schema: stages.timeout_s：单次执行超时，秒
timeout_s = 30
# schema: stages.feedback_to：review/test 反馈目标，必须是之前的阶段
feedback_to = "coding"
# schema: stages.max_rounds：反馈轮次上限，含首轮
max_rounds = 3

[[stages]]
# schema: stages.name：唯一阶段名；字母数字、下划线、点或横线，禁止父目录段
name = "review"
# schema: stages.kind：code/report/review/test；verify 是 test 的兼容别名
kind = "review"
# schema: stages.adapter：非 test 阶段必填，引用具名适配器
adapter = "reviewer"
# schema: stages.prompt：非 test 阶段必填；提示词文件或内联文本
prompt = "prompts/unattended_review.md"
# schema: stages.timeout_s：单次执行超时，秒
timeout_s = 60
# schema: stages.max_attempts：本轮适配器调用尝试次数上限
max_attempts = 2
# schema: stages.feedback_to：review/test 反馈目标，必须是之前的阶段
feedback_to = "coding"
# schema: stages.max_rounds：反馈轮次上限，含首轮
max_rounds = 2

[adapters.api]
type = "openai_compat"
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
max_tokens = 1024
temperature = 0.0
timeout_s = 60

[adapters.reviewer]
type = "openai_compat"
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
max_tokens = 1024
temperature = 0.0
timeout_s = 60
